<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Hisab Kitab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell page-shell" aria-label="Contact Hisab Kitab">
      <section class="screen active">
        <header class="topbar">
          <div>
            <p class="eyebrow">Contact</p>
            <h1>We are here to help</h1>
          </div>
          <a class="icon-button" href="index.html" aria-label="Back to home">←</a>
        </header>

        <nav class="page-links" aria-label="Site pages">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a class="active" href="contact.html">Contact</a>
        </nav>

        <section class="info-card hero-card">
          <p class="eyebrow">Support</p>
          <h2>Questions, feedback, or feature ideas?</h2>
          <p>Send a message and the Hisab Kitab team will get back to you.</p>
        </section>

        <form class="contact-form" aria-label="Contact form">
          <label class="field">
            <span>Your name</span>
            <input name="name" placeholder="Enter your name">
          </label>
          <label class="field">
            <span>Email or phone</span>
            <input name="contact" placeholder="example@email.com">
          </label>
          <label class="field">
            <span>Message</span>
            <textarea name="message" rows="5" placeholder="How can we help?"></textarea>
          </label>
          <button class="primary-button" type="button">Send Message</button>
        </form>

        <section class="contact-list" aria-label="Contact details">
          <a href="mailto:support@hisabkitab.app">support@hisabkitab.app</a>
          <a href="tel:+920000000000">+92 000 0000000</a>
        </section>
      </section>
    </main>
  </body>
</html>
